[workspace]
resolver = "3"
members = ["crates/core", "crates/editor", "crates/history", "crates/ffi", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
snapora-core = { path = "crates/core" }
uniffi = "0.32"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[profile.release]
lto = "thin"
